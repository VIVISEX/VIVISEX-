name: QTS A4 MIS connectivity probe
run-name: A4 PROBE | ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - status/a4/probe_trigger.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qts-a4-mis-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis_probe
      RUN_MODE: env_test
      BATCH_SIZE: "50"
      MAX_RETRIES: "5"
      REQUEST_TIMEOUT: "8"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Execute real TWSE MIS probe
        id: probe
        continue-on-error: true
        run: |
          python "A4_001_TWSE_MIS盤前試撮抓取.py"

      - name: Persist probe evidence
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          mkdir -p status/a4
          git pull --rebase origin "$DEFAULT_BRANCH"

          REPORT="output/mis_probe/env_test_report.json"
          RAW="output/mis_probe/env_test_raw.json"

          if [ -f "$REPORT" ]; then
            jq --arg checked_at "$NOW_TW" \
               --arg workflow_outcome "$PROBE_OUTCOME" \
               --arg run_id "$RUN_ID" \
               --arg run_attempt "$RUN_ATTEMPT" \
               --arg sha "$SHA" \
               --arg raw_file "$RAW" \
               '. + {
                 component: "A4_001_DIAG",
                 checked_at: $checked_at,
                 workflow_outcome: $workflow_outcome,
                 run_id: $run_id,
                 run_attempt: $run_attempt,
                 source_commit: $sha,
                 raw_file: $raw_file,
                 transport_pass: ((.normalized_rows // 0) > 0 and (.errors | length) == 0 and $workflow_outcome == "success")
               }' "$REPORT" > status/a4/probe_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" \
                  --arg workflow_outcome "$PROBE_OUTCOME" \
                  --arg run_id "$RUN_ID" \
                  --arg sha "$SHA" \
                  '{component:"A4_001_DIAG", checked_at:$checked_at, workflow_outcome:$workflow_outcome, run_id:$run_id, source_commit:$sha, transport_pass:false, reason:"NO_ENV_TEST_REPORT"}' \
                  > status/a4/probe_latest.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/probe_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "A4 probe evidence: run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qts-a4-probe-${{ github.run_id }}
          path: output/mis_probe/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce probe result
        if: always()
        run: |
          if [ "${{ steps.probe.outcome }}" != "success" ]; then
            echo "A4 MIS probe failed"
            exit 1
          fi
