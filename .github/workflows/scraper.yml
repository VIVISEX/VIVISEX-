name: QTS A4 TWSE MIS preopen scraper
run-name: A4 MIS ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'LIVE' || format('MANUAL-{0}', inputs.run_mode) }} | ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run mode
        required: true
        default: env_test
        type: choice
        options:
          - env_test
          - live
  schedule:
    - cron: "25 0 * * 1-5"
  push:
    branches:
      - main
    paths:
      - status/a4/recovery_trigger.json

permissions:
  contents: write

concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.run_mode == 'live') && 'qts-a4-mis-production' || format('qts-a4-mis-test-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'live') }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis
      POLL_SECONDS: "5"
      START_TIME: "08:30:00"
      PREOPEN_END: "09:00:00"
      END_TIME: "09:30:00"
      BATCH_SIZE: "50"
      MAX_RETRIES: "4"
      REQUEST_TIMEOUT: "5"
      RETRY_BASE_SECONDS: "0.35"
      RETRY_CAP_SECONDS: "2.0"
      WARMUP_TIMEOUT: "4"
      ENABLE_SINGLE_FALLBACK: "1"
      SINGLE_FALLBACK_RETRIES: "2"
      SINGLE_FALLBACK_TIMEOUT: "4"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MAX_REQUEST_ERROR_RATE: "0.02"
      MIN_PREOPEN_COVERAGE: "0.98"
      MIN_OPEN_COVERAGE: "0.95"
      MIN_SYMBOL_COVERAGE: "1.0"
      MAX_ALLOWED_GAP_SECONDS: "15"
      A4_MARKET_GATE_TIMEOUT: "5"
      RUN_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'live' || inputs.run_mode }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Production duplicate guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUN_MODE" != "live" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=non_live" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DATE_TW=$(TZ=Asia/Taipei date +%F)

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            HH=$(TZ=Asia/Taipei date +%H)
            MM=$(TZ=Asia/Taipei date +%M)
            NOW_MIN=$((10#$HH * 60 + 10#$MM))
            RECOVERY_START=$((8 * 60 + 25))
            RECOVERY_END=$((8 * 60 + 35))
            if [ "$NOW_MIN" -lt "$RECOVERY_START" ] || [ "$NOW_MIN" -gt "$RECOVERY_END" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "reason=outside_recovery_window" >> "$GITHUB_OUTPUT"
              echo "Recovery push ignored outside 08:25-08:35 Asia/Taipei."
              exit 0
            fi
          fi

          git fetch origin "$DEFAULT_BRANCH" --quiet
          COMPLETED_PATH="status/a4/${DATE_TW}_COMPLETED.json"

          if git cat-file -e "origin/${DEFAULT_BRANCH}:${COMPLETED_PATH}" 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=already_completed" >> "$GITHUB_OUTPUT"
            echo "A4 live run already completed for ${DATE_TW}; duplicate/recovery run will exit cleanly."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=not_completed" >> "$GITHUB_OUTPUT"

      - name: Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: TWSE official trading-day gate
        if: steps.guard.outputs.should_run == 'true'
        id: market_gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_MODE" != "live" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "market_status=NON_LIVE" >> "$GITHUB_OUTPUT"
            echo "calendar_verified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python A4_001G_TradingDayGate.py
          echo "should_run=$(jq -r '.should_run' output/mis/market_gate.json)" >> "$GITHUB_OUTPUT"
          echo "market_status=$(jq -r '.market_status' output/mis/market_gate.json)" >> "$GITHUB_OUTPUT"
          echo "calendar_verified=$(jq -r '.calendar_verified' output/mis/market_gate.json)" >> "$GITHUB_OUTPUT"
          cat output/mis/market_gate.json

      - name: Run A4 MIS scraper
        if: steps.guard.outputs.should_run == 'true' && steps.market_gate.outputs.should_run == 'true'
        id: scraper
        continue-on-error: true
        run: |
          python "A4_001_TWSE_MIS盤前試撮抓取.py"

      - name: Upload captured data
        if: ${{ always() && steps.guard.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-mis-${{ github.run_id }}
          path: output/mis/
          if-no-files-found: warn
          retention-days: 90

      - name: Persist A4 run status to repository
        if: ${{ always() && steps.guard.outputs.should_run == 'true' }}
        env:
          SCRAPER_OUTCOME: ${{ steps.scraper.outcome }}
          MARKET_STATUS: ${{ steps.market_gate.outputs.market_status }}
          MARKET_SHOULD_RUN: ${{ steps.market_gate.outputs.should_run }}
          CALENDAR_VERIFIED: ${{ steps.market_gate.outputs.calendar_verified }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          DATE_TW=$(TZ=Asia/Taipei date +%F)
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          REPORT=""

          git pull --rebase origin "$DEFAULT_BRANCH"
          mkdir -p status/a4

          if [ "$MARKET_STATUS" = "MARKET_CLOSED" ] && [ -f "output/mis/market_gate.json" ]; then
            REPORT="output/mis/market_gate.json"
          elif [ -f "output/mis/report_${DATE_TW}.json" ]; then
            REPORT="output/mis/report_${DATE_TW}.json"
          elif [ -f "output/mis/env_test_report.json" ]; then
            REPORT="output/mis/env_test_report.json"
          elif [ -f "output/mis/fatal_error.json" ]; then
            REPORT="output/mis/fatal_error.json"
          fi

          if [ -n "$REPORT" ]; then
            jq --arg checked_at "$NOW_TW" \
               --arg workflow_outcome "$SCRAPER_OUTCOME" \
               --arg market_status "$MARKET_STATUS" \
               --arg market_should_run "$MARKET_SHOULD_RUN" \
               --arg calendar_verified "$CALENDAR_VERIFIED" \
               --arg event_name "$EVENT_NAME" \
               --arg run_id "$RUN_ID" \
               --arg run_attempt "$RUN_ATTEMPT" \
               --arg sha "$SHA" \
               '. + {
                 checked_at: $checked_at,
                 workflow_outcome: $workflow_outcome,
                 market_status: $market_status,
                 market_should_run: ($market_should_run == "true"),
                 calendar_verified: ($calendar_verified == "true"),
                 event_name: $event_name,
                 run_id: $run_id,
                 run_attempt: $run_attempt,
                 source_commit: $sha,
                 production_acceptance_applicable: ($market_status != "MARKET_CLOSED"),
                 pass: (if $market_status == "MARKET_CLOSED" then true else (((.pass // .pass_candidate // false) == true) and ($workflow_outcome == "success")) end)
               }' "$REPORT" > status/a4/latest.json
          else
            jq -n --arg checked_at "$NOW_TW" \
                  --arg workflow_outcome "$SCRAPER_OUTCOME" \
                  --arg market_status "$MARKET_STATUS" \
                  --arg event_name "$EVENT_NAME" \
                  --arg run_id "$RUN_ID" \
                  --arg run_attempt "$RUN_ATTEMPT" \
                  --arg sha "$SHA" \
                  '{
                    checked_at: $checked_at,
                    workflow_outcome: $workflow_outcome,
                    market_status: $market_status,
                    event_name: $event_name,
                    run_id: $run_id,
                    run_attempt: $run_attempt,
                    source_commit: $sha,
                    pass: false,
                    reason: "NO_REPORT_FILE"
                  }' > status/a4/latest.json
          fi

          cp status/a4/latest.json "status/a4/${DATE_TW}_${RUN_ID}.json"

          if jq -e '.pass == true' status/a4/latest.json >/dev/null; then
            cp status/a4/latest.json "status/a4/${DATE_TW}_COMPLETED.json"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/latest.json "status/a4/${DATE_TW}_${RUN_ID}.json"
          if [ -f "status/a4/${DATE_TW}_COMPLETED.json" ]; then
            git add "status/a4/${DATE_TW}_COMPLETED.json"
          fi

          if git diff --cached --quiet; then
            echo "No status changes to commit"
          else
            git commit -m "A4 status: ${DATE_TW} run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Enforce scraper result
        if: always()
        run: |
          if [ "${{ steps.guard.outcome }}" != "success" ]; then
            echo "A4 production guard failed"
            exit 1
          fi

          if [ "${{ steps.guard.outputs.should_run }}" != "true" ]; then
            echo "A4 duplicate/recovery run skipped: ${{ steps.guard.outputs.reason }}"
            exit 0
          fi

          if [ "${{ steps.market_gate.outputs.market_status }}" = "MARKET_CLOSED" ]; then
            echo "A4 market closed; capture correctly skipped"
            exit 0
          fi

          if [ "${{ steps.market_gate.outputs.should_run }}" != "true" ]; then
            echo "A4 trading-day gate did not authorize capture"
            exit 1
          fi

          if [ "${{ steps.scraper.outcome }}" != "success" ]; then
            echo "A4 scraper failed"
            exit 1
          fi
