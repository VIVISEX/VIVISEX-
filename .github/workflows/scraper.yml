name: QTS A4 Complete Control Point V3

run-name: A4 V3 | ${{ github.event_name }} | ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - status/a4/live_trigger.json
  workflow_dispatch:
    inputs:
      run_mode:
        description: A4 control mode
        required: true
        default: env_test
        type: choice
        options:
          - selftest
          - env_test
          - qualify
          - live
          - live_recovery
  schedule:
    - cron: "7 0 * * 1-5"
    - cron: "17 0 * * 1-5"
    - cron: "22 0 * * 1-5"

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  control:
    name: control
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '7 0 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: qts-a4-mis-control
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      POLL_SECONDS: "30"
      MIN_SYMBOL_COVERAGE: "0.995"
      MAX_REQUEST_ERROR_RATE: "0.02"
      MIN_PREOPEN_VALID_CYCLES: "0.95"
      MIN_OPEN_VALID_CYCLES: "0.90"
      MAX_CONSECUTIVE_INVALID_CYCLES: "2"
      MAX_ALLOWED_GAP_SECONDS: "60"
      MIN_TWSE_SYMBOLS: "800"
      MIN_TPEX_SYMBOLS: "600"
      MIN_TOTAL_SYMBOLS: "1500"
      MAX_TOTAL_SYMBOLS: "3000"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve control mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.run_mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="live"
          else
            MODE=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("status/a4/live_trigger.json")
          try:
              x=json.loads(p.read_text(encoding="utf-8"))
              print(str(x.get("run_mode") or "live"))
          except Exception:
              print("live")
          PY
          )
          fi
          case "$MODE" in
            selftest|env_test|qualify|live|live_recovery) ;;
            *) echo "unsupported mode=$MODE"; exit 2 ;;
          esac
          echo "run_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "A4 effective mode=$MODE"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Static compile
        run: python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"

      - name: Integrated selftest
        run: python "A4_001A_CompleteControlPoint.py" --mode selftest

      - name: Publish live runner start evidence
        if: steps.mode.outputs.run_mode == 'live' || steps.mode.outputs.run_mode == 'live_recovery'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          from datetime import datetime,timezone,timedelta
          repo=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ.get("DEFAULT_BRANCH","main")
          token=os.environ["GITHUB_TOKEN"]
          path="status/a4/runner_live.json"
          api=f"https://api.github.com/repos/{repo}/contents/{path}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"QTS-A4-V3"}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api+f"?ref={branch}",headers=headers),timeout=15) as r:
                  sha=json.load(r).get("sha")
          except Exception:
              pass
          tw=timezone(timedelta(hours=8))
          obj={"component":"A4_001A","status":"RUNNER_STARTED","version":"A4_001A_COMPLETE_CONTROL_POINT_V3.0.0","date":datetime.now(tw).date().isoformat(),"started_at":datetime.now(tw).isoformat(timespec="seconds"),"run_id":os.environ.get("GITHUB_RUN_ID"),"run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),"event_name":os.environ.get("GITHUB_EVENT_NAME"),"source_commit":os.environ.get("GITHUB_SHA")}
          body={"message":f"A4 V3 runner started {obj['run_id']}","content":base64.b64encode(json.dumps(obj,ensure_ascii=False,indent=2).encode()).decode(),"branch":branch}
          if sha: body["sha"]=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(req,timeout=15): pass
          print(json.dumps(obj,ensure_ascii=False))
          PY

      - name: Run selected complete control point
        id: control
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.run_mode }}"
          case "$MODE" in
            selftest) python "A4_001A_CompleteControlPoint.py" --mode selftest ;;
            env_test) python "A4_001A_CompleteControlPoint.py" --mode env_test ;;
            qualify) python "A4_001A_CompleteControlPoint.py" --mode qualify ;;
            live|live_recovery) python "A4_001A_CompleteControlPoint.py" --mode live ;;
          esac

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-v3-${{ github.run_id }}
          path: output/a4/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Persist formal status evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DATE_TW=$(TZ=Asia/Taipei date +%F)
          TMP_DIR=$(mktemp -d)
          mkdir -p "$TMP_DIR/status/a4"
          for f in status/a4/latest.json status/a4/qualification_latest.json status/a4/runner_live.json "status/a4/${DATE_TW}_${GITHUB_RUN_ID}.json" "status/a4/${DATE_TW}_COMPLETED.json"; do
            if [ -f "$f" ]; then cp "$f" "$TMP_DIR/status/a4/$(basename "$f")"; fi
          done
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
          mkdir -p status/a4
          cp -f "$TMP_DIR"/status/a4/* status/a4/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "A4 V3 evidence ${DATE_TW} run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin "$DEFAULT_BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            sleep $((attempt * 2))
          done

      - name: Enforce result
        if: always()
        run: |
          if [ "${{ steps.control.outcome }}" != "success" ]; then exit 1; fi

  watchdog_first:
    name: watchdog_first
    if: github.event_name == 'schedule' && github.event.schedule == '17 0 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: qts-a4-watchdog-first
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      POLL_SECONDS: "30"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      A4_WORKFLOW_FILE: scraper.yml
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
      - run: python "A4_001A_CompleteControlPoint.py" --mode watchdog --watchdog-stage first

  watchdog_final:
    name: watchdog_final
    if: github.event_name == 'schedule' && github.event.schedule == '22 0 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: qts-a4-watchdog-final
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      POLL_SECONDS: "30"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      A4_WORKFLOW_FILE: scraper.yml
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas requests pyarrow
      - run: python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
      - run: python "A4_001A_CompleteControlPoint.py" --mode watchdog --watchdog-stage final
