name: QTS A4 Complete Control Point
run-name: A4 CCP | ${{ github.event_name }} | ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - status/a4/live_trigger.json
  workflow_dispatch:
    inputs:
      run_mode:
        description: A4 control mode
        required: true
        default: env_test
        type: choice
        options:
          - selftest
          - env_test
          - live
          - live_recovery
  schedule:
    - cron: "0 0 * * 1-5"
    - cron: "15 0 * * 1-5"

permissions:
  contents: write
  actions: write

jobs:
  production:
    name: production
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'live' || inputs.run_mode == 'live_recovery'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: qts-a4-mis-production
      cancel-in-progress: ${{ github.event_name == 'push' }}
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      POLL_SECONDS: "10"
      RUNTIME_AUDIT_SECONDS: "30"
      RUNTIME_MAX_REPAIRS: "2"
      RUNTIME_FAIL_CLOSED_WINDOWS: "3"
      MIN_TWSE_SYMBOLS: "800"
      MIN_TPEX_SYMBOLS: "600"
      MIN_TOTAL_SYMBOLS: "1500"
      MAX_TOTAL_SYMBOLS: "3000"
      PER_CYCLE_FRESH_COVERAGE: "0.97"
      MIN_PREOPEN_VALID_CYCLES: "0.95"
      MIN_OPEN_VALID_CYCLES: "0.90"
      MIN_P05_SYMBOL_COVERAGE: "0.95"
      MAX_CONSECUTIVE_INVALID_CYCLES: "2"
      MAX_REQUEST_ERROR_RATE: "0.05"
      MAX_ALLOWED_GAP_SECONDS: "30"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish runner start evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime, timezone, timedelta
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ.get('DEFAULT_BRANCH', 'main')
          token = os.environ['GITHUB_TOKEN']
          path = 'status/a4/runner_live.json'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'QTS-A4-Runner-Start',
          }
          sha = None
          try:
              req = urllib.request.Request(api + f'?ref={branch}', headers=headers)
              with urllib.request.urlopen(req, timeout=15) as r:
                  sha = json.load(r).get('sha')
          except Exception:
              pass
          tw = timezone(timedelta(hours=8))
          obj = {
              'component': 'A4_001A',
              'status': 'RUNNER_STARTED',
              'date': datetime.now(tw).date().isoformat(),
              'started_at': datetime.now(tw).isoformat(timespec='seconds'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'source_commit': os.environ.get('GITHUB_SHA'),
          }
          body = {
              'message': f"A4 runner started {obj['run_id']}",
              'content': base64.b64encode(json.dumps(obj, ensure_ascii=False, indent=2).encode()).decode(),
              'branch': branch,
          }
          if sha:
              body['sha'] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(api, data=data, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(req, timeout=15) as r:
              if r.status not in (200, 201):
                  raise RuntimeError(f'RUNNER_EVIDENCE_WRITE_{r.status}')
          print(json.dumps(obj, ensure_ascii=False))
          PY

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Static compile and integrated selftest
        run: |
          python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
          python "A4_001A_CompleteControlPoint.py" --mode selftest

      - name: Run complete production control point
        id: control
        continue-on-error: true
        run: python "A4_001A_CompleteControlPoint.py" --mode live

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-complete-${{ github.run_id }}
          path: output/a4/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Persist formal status evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DATE_TW=$(TZ=Asia/Taipei date +%F)
          RUN_FILE="status/a4/${DATE_TW}_${GITHUB_RUN_ID}.json"
          COMPLETED_FILE="status/a4/${DATE_TW}_COMPLETED.json"
          TMP_DIR=$(mktemp -d)
          mkdir -p "$TMP_DIR/status/a4"
          for f in status/a4/latest.json "$RUN_FILE" "$COMPLETED_FILE"; do
            if [ -f "$f" ]; then cp "$f" "$TMP_DIR/status/a4/$(basename "$f")"; fi
          done
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
          mkdir -p status/a4
          cp -f "$TMP_DIR"/status/a4/* status/a4/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/latest.json "$RUN_FILE" 2>/dev/null || true
          if [ -f "$COMPLETED_FILE" ]; then git add "$COMPLETED_FILE"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "A4 complete status ${DATE_TW} run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push origin "$DEFAULT_BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            sleep $((attempt * 2))
          done

      - name: Enforce complete control point result
        if: always()
        run: |
          if [ "${{ steps.control.outcome }}" != "success" ]; then exit 1; fi

  watchdog:
    name: watchdog
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '15 0 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: qts-a4-watchdog
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      A4_WORKFLOW_FILE: scraper.yml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Static compile and integrated selftest
        run: |
          python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
          python "A4_001A_CompleteControlPoint.py" --mode selftest
      - name: Run integrated two-stage watchdog
        shell: bash
        run: |
          set -u
          FIRST_RC=0
          FINAL_RC=0
          python "A4_001A_CompleteControlPoint.py" --mode watchdog --watchdog-stage first || FIRST_RC=$?
          HH=$(TZ=Asia/Taipei date +%H)
          MM=$(TZ=Asia/Taipei date +%M)
          SS=$(TZ=Asia/Taipei date +%S)
          NOW_SEC=$((10#$HH * 3600 + 10#$MM * 60 + 10#$SS))
          FINAL_SEC=$((8 * 3600 + 29 * 60))
          if [ "$NOW_SEC" -lt "$FINAL_SEC" ]; then sleep $((FINAL_SEC - NOW_SEC)); fi
          python "A4_001A_CompleteControlPoint.py" --mode watchdog --watchdog-stage final || FINAL_RC=$?
          if [ "$FINAL_RC" -ne 0 ]; then exit "$FINAL_RC"; fi
      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-watchdog-${{ github.run_id }}
          path: output/a4/
          if-no-files-found: ignore
          retention-days: 30

  diagnostics:
    name: diagnostics
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_mode == 'selftest' || inputs.run_mode == 'env_test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qts-a4-diagnostics-${{ github.run_id }}
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      OUTPUT_DIR: output/a4
      A4_STATUS_DIR: status/a4
      RUNTIME_AUDIT_SECONDS: "30"
      RUNTIME_MAX_REPAIRS: "2"
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile
        run: python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
      - name: Run diagnostics mode
        run: python "A4_001A_CompleteControlPoint.py" --mode "${{ inputs.run_mode }}"
      - name: Upload diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-diagnostics-${{ github.run_id }}
          path: output/a4/
          if-no-files-found: warn
          retention-days: 30
