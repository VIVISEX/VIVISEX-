name: QTS A4_001C Clock Guard Readiness
run-name: A4_001C CLOCK READINESS | ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - status/a4/clock_readiness_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-001c-clock-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run clock/recovery guard self-test
        id: selftest
        run: python A4_001C_ClockGuardSelfTest.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-clock-readiness-${{ github.run_id }}
          path: output/clock_readiness/
          if-no-files-found: error
          retention-days: 90

      - name: Persist readiness
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.selftest.outcome }}
        run: |
          set -euo pipefail
          git pull --rebase origin "$DEFAULT_BRANCH"
          mkdir -p status/a4
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          REPORT=output/clock_readiness/clock_guard_selftest.json
          if [ -f "$REPORT" ]; then
            jq --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg sha "$SHA" --arg outcome "$OUTCOME" \
              '. + {checked_at:$checked_at, run_id:$run_id, source_commit:$sha, workflow_outcome:$outcome, pass:((.pass == true) and ($outcome == "success"))}' \
              "$REPORT" > status/a4/clock_readiness_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg sha "$SHA" \
              '{component:"A4_001C", pass:false, reason:"NO_SELFTEST_REPORT", checked_at:$checked_at, run_id:$run_id, source_commit:$sha}' \
              > status/a4/clock_readiness_latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/clock_readiness_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "A4_001C clock readiness run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Enforce result
        if: always()
        run: |
          if [ "${{ steps.selftest.outcome }}" != "success" ]; then
            exit 1
          fi
