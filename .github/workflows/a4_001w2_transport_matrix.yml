name: QTS A4 Transport Matrix Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - A4_001W2_TransportMatrixAudit.py
      - .github/workflows/a4_001w2_transport_matrix.yml
      - status/a4/a4_001w2_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-transport-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      RUN_MODE: env_test
      POLL_SECONDS: "5"
      WARMUP_TIMEOUT: "2.0"
      A4_MATRIX_CYCLES: "10"
      A4_MATRIX_INTERVAL: "5"
      A4_MATRIX_OUT: output/transport_matrix
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile
        run: |
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
          python -m py_compile A4_001P_PlaceholderAwareEntrypoint.py
          python -m py_compile A4_001W2_TransportMatrixAudit.py
      - name: Run matrix at real five-second cadence
        id: matrix
        continue-on-error: true
        run: python A4_001W2_TransportMatrixAudit.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a4-transport-matrix-${{ github.run_id }}
          path: output/transport_matrix/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist matrix evidence
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          set -euo pipefail
          test -f output/transport_matrix/summary.json
          cp output/transport_matrix/summary.json /tmp/summary.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/summary.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          o['run_id']=os.environ['RUN_ID']
          o['workflow_outcome']=os.environ['OUTCOME']
          o['pass']=bool(o.get('pass')) and os.environ['OUTCOME']=='success'
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p status/a4
          cp /tmp/summary.json status/a4/a4_001w2_matrix_latest.json
          cp /tmp/summary.json "status/a4/a4_001w2_matrix_${RUN_ID}.json"
          git add status/a4/a4_001w2_matrix_latest.json "status/a4/a4_001w2_matrix_${RUN_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "A4 transport matrix evidence ${RUN_ID}"
            git push origin main
          fi
      - name: Enforce
        if: always()
        run: test "${{ steps.matrix.outcome }}" = "success"
