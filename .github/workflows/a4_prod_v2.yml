name: QTS A4 Production V2

on:
  schedule:
    - cron: "30 23 * * 0-4"
    - cron: "15 0 * * 1-5"
  push:
    branches: [main]
    paths:
      - status/a4/prod_v2_trigger.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qts-a4-prod-v2
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis
      RUN_MODE: live
      POLL_SECONDS: "5"
      START_TIME: "08:30:00"
      PREOPEN_END: "09:00:00"
      END_TIME: "09:30:00"
      BATCH_SIZE: "50"
      MAX_RETRIES: "4"
      REQUEST_TIMEOUT: "5"
      RETRY_BASE_SECONDS: "0.35"
      RETRY_CAP_SECONDS: "2.0"
      WARMUP_TIMEOUT: "4"
      ENABLE_SINGLE_FALLBACK: "1"
      SINGLE_FALLBACK_RETRIES: "2"
      SINGLE_FALLBACK_TIMEOUT: "4"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MAX_REQUEST_ERROR_RATE: "0.02"
      MIN_PREOPEN_COVERAGE: "0.98"
      MIN_OPEN_COVERAGE: "0.95"
      MIN_SYMBOL_COVERAGE: "1.0"
      MAX_ALLOWED_GAP_SECONDS: "15"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Duplicate guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          DATE_TW=$(TZ=Asia/Taipei date +%F)
          git fetch origin main --quiet
          if git cat-file -e "origin/main:status/a4/${DATE_TW}_COMPLETED.json" 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Wait until 08:28:30
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          HH=$(TZ=Asia/Taipei date +%H)
          MM=$(TZ=Asia/Taipei date +%M)
          SS=$(TZ=Asia/Taipei date +%S)
          NOW_SEC=$((10#$HH * 3600 + 10#$MM * 60 + 10#$SS))
          TARGET_SEC=$((8 * 3600 + 28 * 60 + 30))
          if [ "$NOW_SEC" -lt "$TARGET_SEC" ]; then
            sleep $((TARGET_SEC - NOW_SEC))
          fi

      - name: Trading day gate
        if: steps.guard.outputs.should_run == 'true'
        id: gate
        run: python A4_001G_TradingDayGate.py

      - name: Capture
        if: steps.guard.outputs.should_run == 'true'
        id: scraper
        continue-on-error: true
        run: python "A4_001_TWSE_MIS盤前試撮抓取.py"

      - name: Upload
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-prod-v2-${{ github.run_id }}
          path: output/mis/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce
        if: always()
        run: |
          if [ "${{ steps.guard.outputs.should_run }}" = "false" ]; then exit 0; fi
          if [ "${{ steps.scraper.outcome }}" != "success" ]; then exit 1; fi
