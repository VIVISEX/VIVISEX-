name: QTS A4 Live Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a4_live_probe.yml
      - status/a4/live_probe_trigger.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis
      RUN_MODE: env_test
      BATCH_SIZE: "50"
      MAX_RETRIES: "4"
      REQUEST_TIMEOUT: "5"
      RETRY_BASE_SECONDS: "0.35"
      RETRY_CAP_SECONDS: "2.0"
      WARMUP_TIMEOUT: "4"
      ENABLE_SINGLE_FALLBACK: "1"
      SINGLE_FALLBACK_RETRIES: "2"
      SINGLE_FALLBACK_TIMEOUT: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Probe now
        id: probe
        continue-on-error: true
        run: python "A4_001_TWSE_MIS盤前試撮抓取.py"
      - name: Persist probe report
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.probe.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p status/a4
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          if [ -f output/mis/env_test_report.json ]; then
            jq --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg outcome "$OUTCOME" '. + {checked_at:$checked_at,run_id:$run_id,workflow_outcome:$outcome}' output/mis/env_test_report.json > status/a4/live_probe_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg outcome "$OUTCOME" '{checked_at:$checked_at,run_id:$run_id,workflow_outcome:$outcome,pass:false,reason:"NO_PROBE_REPORT"}' > status/a4/live_probe_latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add status/a4/live_probe_latest.json
          git commit -m "A4 live probe status ${RUN_ID}" || true
          git push origin main || true
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-live-probe-${{ github.run_id }}
          path: output/mis/
          if-no-files-found: warn
          retention-days: 7
