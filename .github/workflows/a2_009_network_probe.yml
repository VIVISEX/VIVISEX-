name: A2_009 Network Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'A2_009/**'
      - '.github/workflows/a2_009_network_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - name: Run A2_009 network probe
        run: python A2_009/network_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A2_009_network_probe_output
          path: A2_009/output/
          if-no-files-found: warn
