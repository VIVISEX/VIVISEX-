name: A2_012 FinMind Backfill

on:
  workflow_dispatch:
  push:
    paths:
      - 'A2_012/run_trigger.txt'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: a2-012-finmind-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run A2_012
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          A2_MAX_REQUESTS: '450'
        run: python A2_012/backfill.py

      - name: Persist checkpoint and data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A2_012/checkpoint.json A2_012/report.json A2_012/data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No A2_012 changes to commit"
          else
            git commit -m "A2_012: persist backfill checkpoint"
            git push
          fi

      - name: Upload current report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A2_012_report
          path: |
            A2_012/report.json
            A2_012/checkpoint.json
          if-no-files-found: warn
