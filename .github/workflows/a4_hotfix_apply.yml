name: QTS A4 Hotfix Apply
on:
  push:
    branches: [main]
    paths:
      - A4_V25_patch.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply V2.5 patch
        run: python A4_V25_patch.py
      - name: Static compile
        run: python -m py_compile "A4_001A_CompleteControlPoint.py" "A4_001_TWSE_MIS盤前試撮抓取.py"
      - name: Integrated selftest
        run: |
          pip install pandas requests pyarrow
          python "A4_001A_CompleteControlPoint.py" --mode selftest
      - name: Persist patched control point
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A4_001A_CompleteControlPoint.py .github/workflows/scraper.yml
          git commit -m "A4 V2.5 resilient transport guardian" || exit 0
          git pull --rebase origin main
          git push origin main
