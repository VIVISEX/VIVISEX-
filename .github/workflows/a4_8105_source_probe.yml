name: QTS A4 8105 Source Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/a4_8105_source_probe.yml
      - status/a4/a4_8105_probe_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-8105-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      RUN_MODE: env_test
      POLL_SECONDS: "5"
      BATCH_SIZE: "40"
      PRIMARY_WORKERS: "10"
      RETRY_BATCH_SIZE: "12"
      RETRY_WORKERS: "12"
      SINGLE_FALLBACK_LIMIT: "12"
      PRIMARY_TIMEOUT: "1.35"
      RETRY_TIMEOUT: "0.90"
      SINGLE_TIMEOUT: "0.60"
      CYCLE_BUDGET_SECONDS: "4.60"
      CYCLE_GUARD_SECONDS: "0.15"
      WARMUP_TIMEOUT: "2.0"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Build probe files
        shell: bash
        run: |
          mkdir -p probe
          printf 'market,code,ex_ch\nTSE,8105,tse_8105.tw\n' > probe/8105.csv
          printf 'market,code,ex_ch\nTSE,8105,tse_8105.tw\nTSE,8104,tse_8104.tw\nTSE,8110,tse_8110.tw\nTSE,2330,tse_2330.tw\n' > probe/mixed.csv

      - name: Probe 8105 alone 10 times
        shell: bash
        run: |
          set +e
          mkdir -p probe/out8105
          for i in $(seq 1 10); do
            OUT="probe/out8105/run_${i}"
            mkdir -p "$OUT"
            STOCKS_FILE=probe/8105.csv OUTPUT_DIR="$OUT" python "A4_001_TWSE_MIS盤前試撮抓取.py"
            sleep 0.5
          done

      - name: Probe 8105 with controls 10 times
        shell: bash
        run: |
          set +e
          mkdir -p probe/outmixed
          for i in $(seq 1 10); do
            OUT="probe/outmixed/run_${i}"
            mkdir -p "$OUT"
            STOCKS_FILE=probe/mixed.csv OUTPUT_DIR="$OUT" python "A4_001_TWSE_MIS盤前試撮抓取.py"
            sleep 0.5
          done

      - name: Summarize
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def collect(root):
              out=[]
              for p in sorted(Path(root).glob('run_*/env_test_report.json')):
                  out.append(json.loads(p.read_text(encoding='utf-8')))
              return out
          alone=collect('probe/out8105')
          mixed=collect('probe/outmixed')
          report={
              'component':'A4_8105_SOURCE_PROBE',
              'alone_runs':len(alone),
              'alone_successes':sum(1 for r in alone if r.get('pass')),
              'alone_returned':[r.get('returned_symbols') for r in alone],
              'alone_missing':[r.get('missing_symbols') for r in alone],
              'mixed_runs':len(mixed),
              'mixed_successes':sum(1 for r in mixed if r.get('pass')),
              'mixed_returned':[r.get('returned_symbols') for r in mixed],
              'mixed_missing':[r.get('missing_symbols') for r in mixed],
              'conclusion':None,
          }
          if report['alone_successes']==0 and len(alone)==10 and all('8105' in (m or []) for m in report['alone_missing']):
              report['conclusion']='MIS_DOES_NOT_RETURN_8105_IN_CURRENT_PROBE'
          elif report['alone_successes']==len(alone)==10:
              report['conclusion']='8105_MIS_RETURN_STABLE'
          else:
              report['conclusion']='8105_MIS_RETURN_INTERMITTENT'
          Path('probe/summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: a4-8105-source-probe-${{ github.run_id }}
          path: probe/
          retention-days: 30

      - name: Persist summary
        shell: bash
        run: |
          set -euo pipefail
          cp probe/summary.json /tmp/a4_8105_summary.json
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p status/a4
          cp /tmp/a4_8105_summary.json status/a4/a4_8105_source_probe_latest.json
          git add status/a4/a4_8105_source_probe_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "A4 8105 source probe ${{ github.run_id }}"
            git push origin main
          fi
