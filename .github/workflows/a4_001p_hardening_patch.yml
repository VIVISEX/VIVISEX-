name: QTS A4_001P Hardening Patch
run-name: A4_001P PREWARM | ${{ github.run_id }}

on:
  push:
    branches:
      - main
    paths:
      - status/a4/hardening_patch_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-001p-hardening
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Move MIS session warmup before preopen wait
        run: |
          python - <<'PY'
          from pathlib import Path
          prod = Path('A4_001_TWSE_MIS盤前試撮抓取.py')
          text = prod.read_text(encoding='utf-8')
          old = '''    while phase_for(now_tw().time()) == "WAIT":\n        remaining = (start_at - now_tw()).total_seconds()\n        time.sleep(max(0.2, min(5.0, remaining)))\n\n    session = make_session(warmup=True)\n'''
          new = '''    # Warm the TWSE MIS session before 08:30 so the first market request does not\n    # pay connection/cookie warmup latency after the pre-open window begins.\n    session = make_session(warmup=True)\n\n    while phase_for(now_tw().time()) == "WAIT":\n        remaining = (start_at - now_tw()).total_seconds()\n        time.sleep(max(0.2, min(5.0, remaining)))\n'''
          if old not in text:
              raise SystemExit('prewarm patch target not found')
          prod.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate production syntax and placement
        run: |
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
          python - <<'PY'
          from pathlib import Path
          text = Path('A4_001_TWSE_MIS盤前試撮抓取.py').read_text(encoding='utf-8')
          session_pos = text.index('session = make_session(warmup=True)', text.index('def run_live'))
          wait_pos = text.index('while phase_for(now_tw().time()) == "WAIT"', text.index('def run_live'))
          assert session_pos < wait_pos, (session_pos, wait_pos)
          print('PREWARM_ORDER_PASS')
          PY

      - name: Commit production prewarm
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "A4_001_TWSE_MIS盤前試撮抓取.py"
          git commit -m "A4_001: prewarm MIS session before 08:30"
          for push_attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((push_attempt * 2))
          done
          exit 1
