name: QTS A4_001T Production Readiness
run-name: A4_001T READINESS | ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - status/a4/readiness_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-001t-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
      RUN_MODE: env_test
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis
      BATCH_SIZE: "50"
      MAX_RETRIES: "4"
      REQUEST_TIMEOUT: "5"
      RETRY_BASE_SECONDS: "0.35"
      RETRY_CAP_SECONDS: "2.0"
      WARMUP_TIMEOUT: "4"
      ENABLE_SINGLE_FALLBACK: "1"
      SINGLE_FALLBACK_RETRIES: "2"
      SINGLE_FALLBACK_TIMEOUT: "4"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MAX_REQUEST_ERROR_RATE: "0.02"
      MIN_PREOPEN_COVERAGE: "0.98"
      MIN_OPEN_COVERAGE: "0.95"
      MIN_SYMBOL_COVERAGE: "1.0"
      MAX_ALLOWED_GAP_SECONDS: "15"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Run A4_001T readiness
        id: readiness
        continue-on-error: true
        run: |
          python A4_001T_ProductionReadiness.py

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qts-a4-readiness-${{ github.run_id }}
          path: output/readiness/
          if-no-files-found: error
          retention-days: 90

      - name: Persist readiness status
        if: always()
        env:
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git pull --rebase origin "$DEFAULT_BRANCH"
          mkdir -p status/a4
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          STAMP=$(TZ=Asia/Taipei date +%Y%m%d_%H%M%S)
          REPORT="output/readiness/readiness_report.json"

          if [ -f "$REPORT" ]; then
            jq --arg workflow_outcome "$READINESS_OUTCOME" \
               --arg checked_at "$NOW_TW" \
               --arg run_id "$RUN_ID" \
               --arg run_attempt "$RUN_ATTEMPT" \
               --arg event_name "$EVENT_NAME" \
               --arg sha "$SHA" \
               '. + {
                 workflow_outcome: $workflow_outcome,
                 checked_at: $checked_at,
                 run_id: $run_id,
                 run_attempt: $run_attempt,
                 event_name: $event_name,
                 source_commit: $sha,
                 pass: ((.pass == true) and ($workflow_outcome == "success"))
               }' "$REPORT" > status/a4/readiness_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" \
                  --arg workflow_outcome "$READINESS_OUTCOME" \
                  --arg run_id "$RUN_ID" \
                  --arg sha "$SHA" \
                  '{component:"A4_001T", pass:false, reason:"NO_READINESS_REPORT", checked_at:$checked_at, workflow_outcome:$workflow_outcome, run_id:$run_id, source_commit:$sha}' \
                  > status/a4/readiness_latest.json
          fi

          cp status/a4/readiness_latest.json "status/a4/readiness_${STAMP}_${RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/readiness_latest.json "status/a4/readiness_${STAMP}_${RUN_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "A4_001T readiness: ${STAMP} run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Enforce readiness result
        if: always()
        run: |
          if [ "${{ steps.readiness.outcome }}" != "success" ]; then
            echo "A4_001T readiness failed"
            exit 1
          fi
