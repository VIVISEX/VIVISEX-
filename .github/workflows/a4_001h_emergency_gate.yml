name: QTS A4_001H Emergency Market Gate
run-name: A4_001H EMERGENCY-GATE | ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - status/a4/emergency_gate_test_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-001h-emergency-gate
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
      A4_MARKET_GATE_TIMEOUT: "5"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run emergency gate self test
        id: gate_test
        continue-on-error: true
        run: |
          python A4_001H_EmergencyMarketGateSelfTest.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-emergency-gate-${{ github.run_id }}
          path: output/emergency_gate_test/
          if-no-files-found: error
          retention-days: 90

      - name: Persist emergency gate status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.gate_test.outcome }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git pull --rebase origin "$DEFAULT_BRANCH"
          mkdir -p status/a4
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          STAMP=$(TZ=Asia/Taipei date +%Y%m%d_%H%M%S)
          REPORT="output/emergency_gate_test/emergency_gate_test_report.json"

          if [ -f "$REPORT" ]; then
            jq --arg workflow_outcome "$TEST_OUTCOME" \
               --arg checked_at "$NOW_TW" \
               --arg run_id "$RUN_ID" \
               --arg sha "$SHA" \
               '. + {
                 workflow_outcome: $workflow_outcome,
                 checked_at: $checked_at,
                 run_id: $run_id,
                 source_commit: $sha,
                 pass: ((.pass == true) and ($workflow_outcome == "success"))
               }' "$REPORT" > status/a4/emergency_gate_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" \
                  --arg workflow_outcome "$TEST_OUTCOME" \
                  --arg run_id "$RUN_ID" \
                  --arg sha "$SHA" \
                  '{component:"A4_001H", pass:false, reason:"NO_TEST_REPORT", checked_at:$checked_at, workflow_outcome:$workflow_outcome, run_id:$run_id, source_commit:$sha}' \
                  > status/a4/emergency_gate_latest.json
          fi

          cp status/a4/emergency_gate_latest.json "status/a4/emergency_gate_${STAMP}_${RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/emergency_gate_latest.json "status/a4/emergency_gate_${STAMP}_${RUN_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "A4_001H emergency gate: ${STAMP} run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Enforce result
        if: always()
        run: |
          if [ "${{ steps.gate_test.outcome }}" != "success" ]; then
            echo "A4_001H emergency gate validation failed"
            exit 1
          fi
