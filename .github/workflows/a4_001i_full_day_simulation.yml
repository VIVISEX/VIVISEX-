name: QTS A4_001I Full Day Simulation
run-name: A4_001I FULL-DAY | ${{ github.run_id }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - status/a4/full_day_sim_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-001i-full-day-sim
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      RUN_MODE: env_test
      STOCKS_FILE: stocks.csv
      OUTPUT_DIR: output/mis
      POLL_SECONDS: "5"
      START_TIME: "08:30:00"
      PREOPEN_END: "09:00:00"
      END_TIME: "09:30:00"
      BATCH_SIZE: "50"
      MAX_RETRIES: "4"
      REQUEST_TIMEOUT: "5"
      RETRY_BASE_SECONDS: "0.35"
      RETRY_CAP_SECONDS: "2.0"
      WARMUP_TIMEOUT: "4"
      ENABLE_SINGLE_FALLBACK: "1"
      SINGLE_FALLBACK_RETRIES: "2"
      SINGLE_FALLBACK_TIMEOUT: "4"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MAX_REQUEST_ERROR_RATE: "0.02"
      MIN_PREOPEN_COVERAGE: "0.98"
      MIN_OPEN_COVERAGE: "0.95"
      MIN_SYMBOL_COVERAGE: "1.0"
      MAX_ALLOWED_GAP_SECONDS: "15"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Run accelerated full-session simulation
        id: simulation
        continue-on-error: true
        run: python A4_001I_FullDaySimulation.py

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qts-a4-full-day-sim-${{ github.run_id }}
          path: output/full_day_sim/
          if-no-files-found: error
          retention-days: 90

      - name: Persist simulation status
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.simulation.outcome }}
        run: |
          set -euo pipefail
          git pull --rebase origin "$DEFAULT_BRANCH"
          mkdir -p status/a4
          NOW_TW=$(TZ=Asia/Taipei date --iso-8601=seconds)
          REPORT=output/full_day_sim/full_day_sim_report.json
          if [ -f "$REPORT" ]; then
            jq --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg sha "$SHA" --arg outcome "$OUTCOME" \
              '. + {checked_at:$checked_at, run_id:$run_id, source_commit:$sha, workflow_outcome:$outcome, pass:((.pass == true) and ($outcome == "success"))}' \
              "$REPORT" > status/a4/full_day_sim_latest.json
          else
            jq -n --arg checked_at "$NOW_TW" --arg run_id "$RUN_ID" --arg sha "$SHA" \
              '{component:"A4_001I", pass:false, reason:"NO_SIMULATION_REPORT", checked_at:$checked_at, run_id:$run_id, source_commit:$sha}' \
              > status/a4/full_day_sim_latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/a4/full_day_sim_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "A4_001I full-day simulation run ${RUN_ID}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Enforce simulation result
        if: always()
        run: |
          if [ "${{ steps.simulation.outcome }}" != "success" ]; then
            echo "A4_001I full-day simulation failed"
            exit 1
          fi
