name: QTS A4_002 Permanent Storage SelfTest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - A4_002_PermanentStorage.py
      - .github/workflows/a4_002_storage_selftest.yml

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile A4_002_PermanentStorage.py
      - name: Self test
        run: python A4_002_PermanentStorage.py --self-test
      - name: Persist evidence
        if: always()
        run: |
          if [ -f status/a4/a4_002_storage_selftest_latest.json ]; then
            git config user.name "qts-a4-bot"
            git config user.email "qts-a4-bot@users.noreply.github.com"
            git add status/a4/a4_002_storage_selftest_latest.json
            if ! git diff --cached --quiet; then
              git commit -m "A4_002 selftest evidence run ${{ github.run_id }}"
              for i in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin main && break
                sleep $((i*2))
              done
            fi
          fi
