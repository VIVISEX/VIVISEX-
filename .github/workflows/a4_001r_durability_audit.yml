name: QTS A4_001R Production Durability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - A4_001R_ProductionDurabilityAudit.py
      - .github/workflows/a4_001r_durability_audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile
        run: |
          python -m py_compile A4_001R_ProductionDurabilityAudit.py
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
      - name: Durability audit
        run: python A4_001R_ProductionDurabilityAudit.py
      - name: Persist evidence
        if: always()
        run: |
          if [ -f status/a4/a4_001r_durability_latest.json ]; then
            git config user.name "qts-a4-bot"
            git config user.email "qts-a4-bot@users.noreply.github.com"
            git add status/a4/a4_001r_durability_latest.json
            if ! git diff --cached --quiet; then
              git commit -m "A4_001R durability evidence run ${{ github.run_id }}"
              for i in 1 2 3 4 5; do
                if git push; then exit 0; fi
                git fetch origin main
                git rebase origin/main
                sleep $((i*2))
              done
              exit 1
            fi
          fi
