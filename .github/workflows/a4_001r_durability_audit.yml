name: QTS A4_001R Production Durability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - A4_001R_ProductionDurabilityAudit.py
      - .github/workflows/a4_001r_durability_audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile
        run: |
          python -m py_compile A4_001R_ProductionDurabilityAudit.py
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
      - name: Durability audit
        run: python A4_001R_ProductionDurabilityAudit.py
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          SRC=status/a4/a4_001r_durability_latest.json
          if [ ! -f "$SRC" ]; then
            echo "No durability evidence file"
            exit 1
          fi

          cp "$SRC" /tmp/a4_001r_durability.json
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"

          RUN_FILE="status/a4/a4_001r_durability_${{ github.run_id }}_attempt${{ github.run_attempt }}.json"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p status/a4
            cp /tmp/a4_001r_durability.json status/a4/a4_001r_durability_latest.json
            cp /tmp/a4_001r_durability.json "$RUN_FILE"
            git add status/a4/a4_001r_durability_latest.json "$RUN_FILE"

            if git diff --cached --quiet; then
              echo "Evidence already identical"
              exit 0
            fi

            git commit -m "A4_001R durability evidence run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            if git push origin main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1
