name: QTS A4 Sustained Transport Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - A4_001W_SustainedTransportAudit.py
      - .github/workflows/a4_001w_sustained_transport.yml
      - status/a4/a4_001w_trigger.json

permissions:
  contents: write

concurrency:
  group: qts-a4-sustained-transport-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      RUN_MODE: env_test
      POLL_SECONDS: "5"
      BATCH_SIZE: "80"
      PRIMARY_WORKERS: "1"
      RETRY_BATCH_SIZE: "20"
      RETRY_WORKERS: "1"
      SINGLE_FALLBACK_LIMIT: "8"
      PRIMARY_TIMEOUT: "1.75"
      RETRY_TIMEOUT: "1.00"
      SINGLE_TIMEOUT: "0.65"
      CYCLE_BUDGET_SECONDS: "4.60"
      CYCLE_GUARD_SECONDS: "0.15"
      WARMUP_TIMEOUT: "2.0"
      A4_SUSTAINED_OUT: output/sustained_transport

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile
        run: |
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
          python -m py_compile A4_001P_PlaceholderAwareEntrypoint.py
          python -m py_compile A4_001W_SustainedTransportAudit.py
      - name: 60 cycles at real 5-second cadence
        id: sustained
        continue-on-error: true
        run: python A4_001W_SustainedTransportAudit.py --cycles 60 --interval 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a4-sustained-transport-${{ github.run_id }}
          path: output/sustained_transport/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.sustained.outcome }}
        run: |
          set -euo pipefail
          test -f output/sustained_transport/summary.json
          cp output/sustained_transport/summary.json /tmp/summary.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/summary.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['workflow_outcome']=os.environ['OUTCOME']
          obj['run_id']=os.environ['RUN_ID']
          obj['pass']=bool(obj.get('pass')) and os.environ['OUTCOME']=='success'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p status/a4
          cp /tmp/summary.json status/a4/a4_001w_sustained_latest.json
          cp /tmp/summary.json "status/a4/a4_001w_sustained_${RUN_ID}.json"
          git add status/a4/a4_001w_sustained_latest.json "status/a4/a4_001w_sustained_${RUN_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "A4 sustained transport evidence ${RUN_ID}"
            git push origin main
          fi
      - name: Enforce
        if: always()
        run: |
          test "${{ steps.sustained.outcome }}" = "success"
