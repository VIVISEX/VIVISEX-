name: QTS A4 Self-Rescue Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - A4_001X_RuntimeSupervisor.py
      - A4_001Y_RawIntegrityAudit.py
      - A4_001Z_SelfRescueValidation.py
      - A4_001_TWSE_MIS盤前試撮抓取.py
      - .github/workflows/a4_001xyz_self_rescue_validation.yml

permissions:
  contents: write

concurrency:
  group: qts-a4-self-rescue-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      POLL_SECONDS: "5"
      BATCH_SIZE: "40"
      PRIMARY_WORKERS: "10"
      RETRY_BATCH_SIZE: "12"
      RETRY_WORKERS: "12"
      SINGLE_FALLBACK_LIMIT: "12"
      PRIMARY_TIMEOUT: "1.35"
      RETRY_TIMEOUT: "0.90"
      SINGLE_TIMEOUT: "0.60"
      CYCLE_BUDGET_SECONDS: "4.60"
      CYCLE_GUARD_SECONDS: "0.15"
      WARMUP_TIMEOUT: "2.0"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MIN_SYMBOL_COVERAGE: "1.0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Compile
        run: |
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
          python -m py_compile A4_001X_RuntimeSupervisor.py
          python -m py_compile A4_001Y_RawIntegrityAudit.py
          python -m py_compile A4_001Z_SelfRescueValidation.py

      - name: Runtime supervisor fault injection
        run: python A4_001X_RuntimeSupervisor.py --self-test

      - name: Raw restart-integrity selftest
        run: python A4_001Y_RawIntegrityAudit.py --self-test

      - name: Missing-symbol and fail-closed validation
        run: python A4_001Z_SelfRescueValidation.py

      - name: Five repeated real TWSE 309-symbol probes
        id: probes
        shell: bash
        run: |
          set +e
          mkdir -p output/repeated_probe
          FAILS=0
          for i in 1 2 3 4 5; do
            echo "=== REAL PROBE ${i}/5 ==="
            OUT="output/repeated_probe/run_${i}"
            mkdir -p "$OUT"
            RUN_MODE=env_test OUTPUT_DIR="$OUT" python "A4_001_TWSE_MIS盤前試撮抓取.py"
            RC=$?
            if [ "$RC" -ne 0 ]; then FAILS=$((FAILS+1)); fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[]
          for p in sorted(Path('output/repeated_probe').glob('run_*/env_test_report.json')):
              reports.append(json.loads(p.read_text(encoding='utf-8')))
          summary={
              'component':'A4_001_REAL_REPEAT_PROBE',
              'runs':len(reports),
              'successes':sum(1 for r in reports if r.get('pass')),
              'requested_symbols':[r.get('requested_symbols') for r in reports],
              'returned_symbols':[r.get('returned_symbols') for r in reports],
              'missing_symbols':[r.get('missing_symbols') for r in reports],
              'cycle_elapsed_seconds':[r.get('cycle_elapsed_seconds') for r in reports],
          }
          summary['pass']=summary['runs']==5 and summary['successes']==5
          Path('output/repeated_probe/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY
          TEST_PASS=$(python -c "import json;print(str(json.load(open('output/repeated_probe/summary.json'))['pass']).lower())")
          if [ "$TEST_PASS" != "true" ]; then exit 1; fi

      - name: Build evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p status/a4
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              p=Path(path)
              if not p.exists(): return None
              return json.loads(p.read_text(encoding='utf-8'))
          report={
              'component':'A4_001XYZ_SELF_RESCUE_VALIDATION',
              'run_id':os.environ['RUN_ID'],
              'run_attempt':os.environ['RUN_ATTEMPT'],
              'job_status':os.environ['JOB_STATUS'],
              'supervisor_selftest': load('output/mis/supervisor_selftest.json'),
              'recovery_validation': load('status/a4/a4_001z_self_rescue_latest.json'),
              'real_repeat_probe': load('output/repeated_probe/summary.json'),
          }
          # supervisor --self-test prints detailed results but its temp files are removed;
          # success is enforced by the step result. Keep overall evidence strict.
          report['pass'] = (
              report['job_status']=='success'
              and bool(report['recovery_validation'] and report['recovery_validation'].get('pass'))
              and bool(report['real_repeat_probe'] and report['real_repeat_probe'].get('pass'))
          )
          Path('status/a4/a4_001_self_rescue_latest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a4-self-rescue-validation-${{ github.run_id }}
          path: |
            output/repeated_probe/
            status/a4/a4_001z_self_rescue_latest.json
            status/a4/a4_001_self_rescue_latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist evidence to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SRC=status/a4/a4_001_self_rescue_latest.json
          test -f "$SRC"
          cp "$SRC" /tmp/a4_self_rescue.json
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"
          RUN_FILE="status/a4/a4_001_self_rescue_${{ github.run_id }}_attempt${{ github.run_attempt }}.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p status/a4
            cp /tmp/a4_self_rescue.json status/a4/a4_001_self_rescue_latest.json
            cp /tmp/a4_self_rescue.json "$RUN_FILE"
            git add status/a4/a4_001_self_rescue_latest.json "$RUN_FILE"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "A4 self-rescue evidence ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            if git push origin main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
