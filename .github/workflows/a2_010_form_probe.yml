name: A2_010 Form Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'A2_010/**'
      - '.github/workflows/a2_010_form_probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - name: Run A2_010 form probe
        run: python A2_010/form_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A2_010_form_probe_output
          path: A2_010/output/
          if-no-files-found: warn
      - name: Persist diagnostic text to repository
        if: always()
        shell: bash
        run: |
          mkdir -p A2_010_results
          cp A2_010/output/report.json A2_010_results/report.json 2>/dev/null || true
          cp A2_010/output/script_*.js A2_010_results/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A2_010_results
          if ! git diff --cached --quiet; then
            git commit -m "A2_010: persist latest form probe result"
            git push
          fi
