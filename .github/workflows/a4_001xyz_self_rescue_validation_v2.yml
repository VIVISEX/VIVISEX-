name: QTS A4 Self-Rescue Validation V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - A4_001P_PlaceholderAwareEntrypoint.py
      - A4_001X_RuntimeSupervisor.py
      - A4_001Y_RawIntegrityAudit.py
      - A4_001Z_SelfRescueValidation.py
      - A4_001_TWSE_MIS盤前試撮抓取.py
      - .github/workflows/a4_001xyz_self_rescue_validation_v2.yml

permissions:
  contents: write

concurrency:
  group: qts-a4-self-rescue-validation-v2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Taipei
      STOCKS_FILE: stocks.csv
      POLL_SECONDS: "5"
      BATCH_SIZE: "40"
      PRIMARY_WORKERS: "10"
      RETRY_BATCH_SIZE: "12"
      RETRY_WORKERS: "12"
      SINGLE_FALLBACK_LIMIT: "12"
      PRIMARY_TIMEOUT: "1.35"
      RETRY_TIMEOUT: "0.90"
      SINGLE_TIMEOUT: "0.60"
      CYCLE_BUDGET_SECONDS: "4.60"
      CYCLE_GUARD_SECONDS: "0.15"
      WARMUP_TIMEOUT: "2.0"
      SOURCE_GAP_CONSECUTIVE_CYCLES: "3"
      MIN_SYMBOL_COVERAGE: "1.0"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow
      - name: Compile all candidate components
        run: |
          python -m py_compile "A4_001_TWSE_MIS盤前試撮抓取.py"
          python -m py_compile A4_001P_PlaceholderAwareEntrypoint.py
          python -m py_compile A4_001X_RuntimeSupervisor.py
          python -m py_compile A4_001Y_RawIntegrityAudit.py
          python -m py_compile A4_001Z_SelfRescueValidation.py
      - name: Placeholder semantic selftest
        id: placeholder
        run: python A4_001P_PlaceholderAwareEntrypoint.py --self-test
      - name: Runtime supervisor fault injection
        id: supervisor
        run: python A4_001X_RuntimeSupervisor.py --self-test
      - name: Raw restart-integrity selftest
        id: raw_audit
        run: python A4_001Y_RawIntegrityAudit.py --self-test
      - name: Retry and fail-closed fault injection
        id: rescue
        run: python A4_001Z_SelfRescueValidation.py
      - name: Ten repeated real TWSE 309-symbol probes
        id: probes
        shell: bash
        run: |
          set +e
          rm -rf output/repeated_probe_v2
          mkdir -p output/repeated_probe_v2
          for i in $(seq 1 10); do
            echo "=== REAL PLACEHOLDER-AWARE PROBE ${i}/10 ==="
            OUT="output/repeated_probe_v2/run_${i}"
            mkdir -p "$OUT"
            RUN_MODE=env_test OUTPUT_DIR="$OUT" python A4_001P_PlaceholderAwareEntrypoint.py
            sleep 0.75
          done
          python - <<'PY'
          import json
          from pathlib import Path
          reports=[]
          diagnostics=[]
          for p in sorted(Path('output/repeated_probe_v2').glob('run_*/env_test_report.json')):
              reports.append(json.loads(p.read_text(encoding='utf-8')))
              d=p.with_name('env_test_diagnostics.json')
              diagnostics.append(json.loads(d.read_text(encoding='utf-8')) if d.exists() else {})
          summary={
              'component':'A4_001_REAL_REPEAT_PROBE_V2',
              'runs':len(reports),
              'successes':sum(1 for r in reports if r.get('pass')),
              'requested_symbols':[r.get('requested_symbols') for r in reports],
              'returned_symbols':[r.get('returned_symbols') for r in reports],
              'missing_symbols':[r.get('missing_symbols') for r in reports],
              'cycle_elapsed_seconds':[r.get('cycle_elapsed_seconds') for r in reports],
              'placeholder_symbols':[d.get('placeholder_symbols',[]) for d in diagnostics],
              'request_errors':[r.get('request_errors') for r in reports],
          }
          summary['max_cycle_elapsed_seconds']=max([x or 0 for x in summary['cycle_elapsed_seconds']],default=0)
          summary['pass']=(summary['runs']==10 and summary['successes']==10 and all(x==309 for x in summary['returned_symbols']) and summary['max_cycle_elapsed_seconds']<=4.85)
          Path('output/repeated_probe_v2/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          raise SystemExit(0 if summary['pass'] else 2)
          PY
      - name: Build strict evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PLACEHOLDER_OUTCOME: ${{ steps.placeholder.outcome }}
          SUPERVISOR_OUTCOME: ${{ steps.supervisor.outcome }}
          RAW_AUDIT_OUTCOME: ${{ steps.raw_audit.outcome }}
          RESCUE_OUTCOME: ${{ steps.rescue.outcome }}
          PROBES_OUTCOME: ${{ steps.probes.outcome }}
        run: |
          mkdir -p status/a4
          python - <<'PY'
          import json,os
          from pathlib import Path
          def load(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
          outcomes={
              'placeholder':os.environ['PLACEHOLDER_OUTCOME'],
              'supervisor':os.environ['SUPERVISOR_OUTCOME'],
              'raw_audit':os.environ['RAW_AUDIT_OUTCOME'],
              'rescue':os.environ['RESCUE_OUTCOME'],
              'real_probes':os.environ['PROBES_OUTCOME'],
          }
          report={
              'component':'A4_001XYZ_SELF_RESCUE_VALIDATION_V2',
              'run_id':os.environ['RUN_ID'],
              'run_attempt':os.environ['RUN_ATTEMPT'],
              'job_status':os.environ['JOB_STATUS'],
              'step_outcomes':outcomes,
              'supervisor_selftest':load('status/a4/a4_001x_supervisor_selftest.json'),
              'recovery_validation':load('status/a4/a4_001z_self_rescue_latest.json'),
              'real_repeat_probe':load('output/repeated_probe_v2/summary.json'),
          }
          report['pass']=(all(v=='success' for v in outcomes.values()) and bool(report['supervisor_selftest'] and report['supervisor_selftest'].get('pass')) and bool(report['recovery_validation'] and report['recovery_validation'].get('pass')) and bool(report['real_repeat_probe'] and report['real_repeat_probe'].get('pass')))
          Path('status/a4/a4_001_self_rescue_v2_latest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a4-self-rescue-v2-${{ github.run_id }}
          path: |
            output/repeated_probe_v2/
            status/a4/a4_001x_supervisor_selftest.json
            status/a4/a4_001z_self_rescue_latest.json
            status/a4/a4_001_self_rescue_v2_latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SRC=status/a4/a4_001_self_rescue_v2_latest.json
          test -f "$SRC"
          cp "$SRC" /tmp/a4_self_rescue_v2.json
          git config user.name "qts-a4-bot"
          git config user.email "qts-a4-bot@users.noreply.github.com"
          RUN_FILE="status/a4/a4_001_self_rescue_v2_${{ github.run_id }}_attempt${{ github.run_attempt }}.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p status/a4
            cp /tmp/a4_self_rescue_v2.json status/a4/a4_001_self_rescue_v2_latest.json
            cp /tmp/a4_self_rescue_v2.json "$RUN_FILE"
            git add status/a4/a4_001_self_rescue_v2_latest.json "$RUN_FILE"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "A4 self-rescue v2 evidence ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            if git push origin main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
